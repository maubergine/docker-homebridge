name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck -S error ./*.sh scripts/*.sh rootfs/defaults/startup.sh
          # s6's with-contenv shebang isn't recognised, so name the shell
          shellcheck -S error --shell=sh rootfs/etc/s6-overlay/scripts/*.sh

      - name: Check the test compose file
        env:
          HOMEBRIDGE_IMAGE: ghcr.io/homebridge/homebridge:latest
        run: docker compose -f test/docker-compose.yml config --quiet

      - name: Set build args from package.json
        id: args
        run: |
          {
            echo "apt_pkg=v$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' package.json | sed 's/\^//')"
            echo "ffmpeg=v$(jq -r '.dependencies["ffmpeg-for-homebridge"]' package.json | sed 's/\^//')"
          } >> "$GITHUB_OUTPUT"

      - name: Build the image (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            HOMEBRIDGE_APT_PKG_VERSION=${{ steps.args.outputs.apt_pkg }}
            FFMPEG_FOR_HOMEBRIDGE_VERSION=${{ steps.args.outputs.ffmpeg }}
            DOCKER_HOMEBRIDGE_VERSION=ci
