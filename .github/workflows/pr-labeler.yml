name: PR Labeler

on:
  pull_request_target: # required for auto labeler
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: homebridge/.github/.github/workflows/pr-labeler.yml@e033cad4852d03b7d19d7307aafedea11ed4a216 # latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
